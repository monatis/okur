[package]
name = "okur-linux-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Linux's accessibility and speech data as data: what the Linux driver (okur-linux) and replay
# share, with no call to Linux, so it builds and is tested on every OS
# (docs/plans/2026-11-05-linux-first.md).

[dependencies]
okur-core = { workspace = true }
serde = { workspace = true }
xa11y-core = { workspace = true }
# Chrome builds its AT-SPI and its IA2 objects from the same node: a page read over AT-SPI is
# given as IA2 objects to the conversion Windows parity checks (page.rs).
okur-model = { workspace = true }
okur-windows-model = { workspace = true }
xa11y-windows = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
