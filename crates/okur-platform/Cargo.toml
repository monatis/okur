[package]
name = "okur-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
okur-core = { workspace = true }
okur-ui-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Okur's settings files: read with toml, written with toml_edit so a user's comments stay.
toml = "1"
toml_edit = "0.25"
tracing = { workspace = true }
xa11y = { workspace = true }
xa11y-windows = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_Speech",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_System_Variant",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_StationsAndDesktops",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Media_Core",
    "Media_SpeechSynthesis",
    "Media_Ocr",
    "Data_Pdf",
    "Storage",
    "Graphics_Imaging",
    "Globalization",
    "Storage_Streams",
    "Foundation_Collections",
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
] }
windows-core = "0.62"
windows-future = "0.3"

