[package]
name = "okur-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Okur's own words, from the message catalog in `locales/` (see src/messages.rs).
fluent-bundle = "0.16"
okur-ui-model = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unic-langid = "0.9"
unicode_names2 = "1"

[build-dependencies]
# build.rs reads the catalog's messages and their variables, so every call site is checked.
fluent-syntax = "0.12"
