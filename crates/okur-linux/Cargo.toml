[package]
name = "okur-linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Okur's driver for Linux (Tier 2, AGENTS.md section 1.3): its keyboard (X11, then Wayland's
# KeyboardMonitor), AT-SPI events and reads through crates/xa11y, and speech through
# speech-dispatcher. Built on Linux alone; elsewhere the crate is empty.

[dependencies]
okur-linux-model = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
okur-core = { workspace = true }
okur-runtime = { workspace = true }
tracing = { workspace = true }
x11rb = { version = "0.14", default-features = false, features = ["xinput"] }
xa11y-core = { workspace = true }
xa11y-linux = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
