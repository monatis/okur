[package]
name = "okur-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
okur-ui-model = { workspace = true }

# GTK 4 on Linux: built in the lab, where its development files are (setup.sh); the dev box's
# Linux clippy leaves this crate out.
[target.'cfg(target_os = "linux")'.dependencies]
# 4.12: a list's Tab behavior and scrolling to an item (Ubuntu 24.04 has 4.14).
gtk4 = { version = "0.10", features = ["v4_12"] }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
