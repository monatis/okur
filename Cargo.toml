[workspace]
resolver = "2"
members= [
    "crates/okur-core",
    "crates/okur-platform",
    "crates/okur-corpus",
    "crates/okur",
    "crates/okur-lab",
    "crates/okur-setup",
    "crates/okur-ui",
    "crates/okur-ui-model",
    "crates/okur-speech-recorder",
    "crates/xa11y/xa11y",
    "crates/xa11y/xa11y-core",
    "crates/xa11y/xa11y-windows",
    "crates/xa11y/xa11y-macos",
    "crates/xa11y/xa11y-linux",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["M. Yusuf Sarıgöz"]
license = "Apache-2.0"

[workspace.dependencies]
okur-core = { path = "crates/okur-core" }
okur-platform = { path = "crates/okur-platform" }
okur-corpus = { path = "crates/okur-corpus" }
okur-ui-model = { path = "crates/okur-ui-model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
sha2 = "0.10"
csv = "1.3"
# Vendored from xa11y 0.15.2 (MIT, see crates/xa11y/LICENSE) and extended in-tree.
xa11y = { path = "crates/xa11y/xa11y", default-features = false }
xa11y-core = { path = "crates/xa11y/xa11y-core", default-features = false }
xa11y-windows = { path = "crates/xa11y/xa11y-windows" }
xa11y-macos = { path = "crates/xa11y/xa11y-macos" }
xa11y-linux = { path = "crates/xa11y/xa11y-linux" }



# Okur runs live from `target/debug` on the dev box (`docs/references/live-daemon-guide.md`).
# Unoptimized, its page reads, buffer builds and key paths ran 3 to 10 times slower than in
# release (responsiveness review, 2026-10-19). Debug builds keep their debug information and
# overflow checks; Okur's crates are optimized lightly, the dependencies fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
