[workspace]
resolver = "2"
members= [
    "crates/sr-core",
    "crates/sr-platform",
    "crates/sr-corpus",
    "crates/sr-cli",
    "crates/xa11y/xa11y",
    "crates/xa11y/xa11y-core",
    "crates/xa11y/xa11y-windows",
    "crates/xa11y/xa11y-macos",
    "crates/xa11y/xa11y-linux",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ALTAI"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sr-core = { path = "crates/sr-core" }
sr-platform = { path = "crates/sr-platform" }
sr-corpus = { path = "crates/sr-corpus" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
sha2 = "0.10"
# Vendored from xa11y 0.15.2 (MIT, see crates/xa11y/LICENSE) and extended in-tree.
xa11y = { path = "crates/xa11y/xa11y", default-features = false }
xa11y-core = { path = "crates/xa11y/xa11y-core", default-features = false }
xa11y-windows = { path = "crates/xa11y/xa11y-windows" }
xa11y-macos = { path = "crates/xa11y/xa11y-macos" }
xa11y-linux = { path = "crates/xa11y/xa11y-linux" }


