<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dialog and Formatting Reference Fixture</title>
</head>
<body>
  <h1>System Overview</h1>

  <p style="font-family: Arial; font-size: 16pt; font-weight: bold; text-align: left;">
    Screen reader accessibility engine.
  </p>

  <p>
    Standard document paragraph for text selection and cursor inspection.
  </p>

  <div id="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <h2 id="dialog-title">Confirm Account Deletion</h2>
    <p>Are you sure you want to permanently delete your account?</p>
    <button id="btn-delete" type="button">Delete Account</button>
    <button id="btn-cancel" type="button">Cancel</button>
  </div>

  <p>
    Backdrop footer text outside the modal dialog.
  </p>
</body>
</html>
