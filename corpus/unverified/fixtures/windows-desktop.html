<!DOCTYPE html>
<!-- Native Windows Desktop & Shell Bar Synthetic Fixture (see windows-desktop.aom.json for xa11y accessibility tree) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Windows Desktop</title>
</head>
<body>
  <div role="region" aria-label="Desktop">
    <ul role="list" aria-label="FolderView">
      <li role="listitem">This PC</li>
      <li role="listitem">Recycle Bin</li>
      <li role="listitem">Task Manager</li>
      <li role="listitem">Google Chrome</li>
      <li role="listitem">Terminal</li>
      <li role="listitem">Word</li>
    </ul>
  </div>
</body>
</html>
