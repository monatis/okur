<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Notes - Riverside Library</title>
  <style>
    #note { color: #000080; background-color: #ffff00; }
    #reply { color: #ff0000; background-color: #ffffff; }
  </style>
</head>
<body>
  <main>
    <h1>Event notes</h1>
    <form action="#" onsubmit="return false">
      <p>
        <label for="note">Note</label>
        <input type="text" id="note" name="note" value="Bring a lamp">
      </p>
      <p>
        <label for="reply">Reply</label>
        <input type="text" id="reply" name="reply" value="Will do">
      </p>
      <p>
        <label for="plain">Plain</label>
        <input type="text" id="plain" name="plain">
      </p>
    </form>
  </main>
</body>
</html>
