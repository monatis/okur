<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>Reading Room Rules - Riverside Library</title>
</head>
<body>
  <main>
    <h1>Reading room rules</h1>
    <p>Quiet study is welcome in the reading room on every floor.</p>
    <h2>Food and drink</h2>
    <p>Water in a closed bottle is allowed; meals are not.</p>
    <h2>Devices</h2>
    <p>Phones stay silent, and calls are taken in the lobby.</p>
    <h2>Opening hours</h2>
    <p>The reading room opens at nine and closes at eight.</p>
  </main>
</body>
</html>
