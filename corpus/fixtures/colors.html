<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Colors</title>
  <style>
    body { background-color: #ffffff; color: #000000; }
  </style>
</head>
<body>
  <h1>Text colors</h1>
  <p style="color: #ff0000">Pure red text.</p>
  <p style="color: #0000ee">Link blue text.</p>
  <p style="color: #000080">Navy text.</p>
  <p style="color: #008000">Dark green text.</p>
  <p style="color: #808080">Gray text.</p>
  <p style="color: #123456">An unnamed color.</p>
  <p style="color: #ffffff; background-color: #000000">White on black.</p>
  <p style="background-color: #ffff00">On a yellow background.</p>
  <p>Text in the page's own colors.</p>
</body>
</html>
