<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Same and Different Elements</title>
</head>
<body>
  <h1>Same and different elements</h1>
  <p>The first paragraph.</p>
  <p>The second paragraph.</p>
  <ul>
    <li>Apple</li>
    <li>Pear</li>
  </ul>
  <p>A paragraph between two lists.</p>
  <ul>
    <li>Plum</li>
  </ul>
  <h2>Links</h2>
  <p>Text with <a href="#one">a first link</a> in it.</p>
  <p><a href="#two">A second link</a></p>
  <p><a href="other-page.html">A link to another page</a></p>
  <h2>Last part</h2>
  <p>The <strong>last</strong> paragraph.</p>
</body>
</html>
