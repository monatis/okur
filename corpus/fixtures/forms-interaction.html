<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forms and Interaction Reference Fixture</title>
</head>
<body>
  <h1>Account Registration Form</h1>
  <form id="user-form" action="#" method="post">
    <div>
      <label for="full-name">Full Name:</label>
      <input type="text" id="full-name" name="full-name" value="Jane Doe">
    </div>
    <div>
      <label for="email-addr">Email Address:</label>
      <input type="text" id="email-addr" name="email-addr" value="jane@example.com">
    </div>
    <div>
      <input type="checkbox" id="terms-agree" name="terms">
      <label for="terms-agree">I accept terms and conditions</label>
    </div>
    <div>
      <button type="button" id="save-btn">Save Preferences</button>
      <button type="submit" id="submit-btn">Submit Application</button>
    </div>
  </form>
</body>
</html>
