<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Positions</title>
  <style>
    body { background-color: #ffffff; color: #000000; }
  </style>
</head>
<body>
  <h1>Raised and lowered text</h1>
  <p>A plain line with nothing raised.</p>
  <p>A mole holds 6 &times; 10<sup>23</sup> particles.</p>
  <p>The sum runs to x<sup>n</sup> at most.</p>
  <p>Footnote mark<sup>a</sup> after a word.</p>
  <p>The scale uses log<sub>10</sub> steps.</p>
  <p>Each term x<sub>i</sub> is counted once.</p>
  <p>The entry a<sub>ij</sub> sits in row i.</p>
  <p>Another plain line at the end.</p>
</body>
</html>
