<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Structures Fixture</title>
</head>
<body>
<h1>Structures Fixture</h1>
<p>Each structure below has one line of its own text.</p>
<figure>
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="A small square" width="40" height="40">
  <figcaption>Figure caption text</figcaption>
</figure>
<div role="feed" aria-label="Updates">
  <article aria-label="First update"><p>First update text</p></article>
  <article aria-label="Second update"><p>Second update text</p></article>
</div>
<div role="log" aria-label="Messages"><p>Log entry text</p></div>
<div role="note"><p>Note text</p></div>
<div role="toolbar" aria-label="Formatting">
  <button type="button">Bold</button>
  <button type="button">Italic</button>
</div>
<div contenteditable="true" aria-label="Notes field"><p>Editable text</p></div>
<fieldset>
  <legend>Delivery</legend>
  <label><input type="checkbox"> Express</label>
</fieldset>
<form aria-label="Contact form">
  <label for="email">Email</label>
  <input type="text" id="email" autocomplete="off">
</form>
<section aria-label="Opening hours"><p>Region text</p></section>
<div role="search" aria-label="Site search">
  <label for="query">Search</label>
  <input type="text" id="query" autocomplete="off">
</div>
<p>The end of the structures.</p>
</body>
</html>
