<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edits and Marks</title>
  <style>
    body { background-color: #ffffff; color: #000000; }
  </style>
</head>
<body>
  <h1>Edits and marks</h1>
  <p>The price was <del>twelve</del> <ins>ten</ins> dollars.</p>
  <p><ins>A whole line inserted.</ins></p>
  <p>Search for <mark>library</mark> found it.</p>
  <p>A mole holds 10<sup>23</sup> particles.</p>
  <p>Another plain line at the end.</p>
</body>
</html>
