<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wrapped Notes - Text Area Fixture</title>
  <style>
    /* Narrow on any screen: each line of the text wraps where the text area ends. */
    textarea { width: 14em; font: 16px monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Branch notes</h1>
    <p>
      <label for="notes">Notes</label>
      <textarea id="notes" rows="8" cols="14">The reading room opens at nine on weekdays.
Quiet please.</textarea>
    </p>
    <p><button type="button">Save</button></p>
  </main>
</body>
</html>
